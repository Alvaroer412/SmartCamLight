name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build SmartCamLight.exe
        shell: powershell
        run: .\build.ps1

      - name: Build SmartCamLight-arm64.exe
        shell: powershell
        run: .\build.ps1 -Platform arm64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCamLight
          path: |
            bin/SmartCamLight.exe
            bin/SmartCamLight-arm64.exe

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/SmartCamLight.exe
            bin/SmartCamLight-arm64.exe
          generate_release_notes: true
